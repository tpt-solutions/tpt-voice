# cargo-deny configuration for tpt-voice.
# Enforces the licensing rules from spec.txt §8: permissive licenses only.
# Under cargo-deny v2 semantics everything NOT in `allow` is rejected, so
# GPL/LGPL/AGPL/MPL (spec §8 banned list) are denied implicitly — and any
# other license we have not vetted.

[graph]
all-features = true

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
]
# Banned per spec.txt §8 — listed for documentation; enforcement comes
# from the allow-list above (default-deny):
#   GPL-2.0/GPL-3.0 (any form), LGPL-2.1/LGPL-3.0 (any form),
#   AGPL-3.0 (any form), MPL-1.1/MPL-2.0
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
version = 2
yanked = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
